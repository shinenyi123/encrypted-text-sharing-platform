<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Login - Encrypted Text Sharing Platform
</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;


    background:
    linear-gradient(
        135deg,
        #020617,
        #1d4ed8,
        #06b6d4
    );


    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

}



.auth-container{

    width:100%;

    padding:20px;

}



.auth-card{


    max-width:420px;

    margin:auto;

    padding:40px;


    background:
    rgba(255,255,255,0.12);


    backdrop-filter:
    blur(20px);


    border-radius:25px;


    border:
    1px solid rgba(255,255,255,0.25);


    box-shadow:
    0 20px 50px rgba(0,0,0,0.35);


    animation:
    show .6s ease;

}



@keyframes show{

    from{

        opacity:0;

        transform:
        translateY(40px);

    }


    to{

        opacity:1;

        transform:
        translateY(0);

    }

}




.auth-logo{


    width:85px;

    height:85px;


    margin:auto;


    border-radius:50%;


    display:flex;

    justify-content:center;

    align-items:center;


    font-size:38px;


    color:white;


    background:
    linear-gradient(
        135deg,
        #2563eb,
        #22d3ee
    );


    box-shadow:
    0 10px 30px rgba(0,0,0,.3);


}



.auth-header{


    text-align:center;

    margin-top:25px;

    color:white;


}


.auth-header h1{

    font-size:27px;

    margin-bottom:10px;

}



.auth-header p{

    color:#dbeafe;

    font-size:14px;

}




.error-message{


    margin-top:20px;


    text-align:center;


    color:#fecaca;


    font-size:14px;


}




.form-group{


    margin-top:20px;


}




.form-group label{


    display:block;


    color:white;


    margin-bottom:8px;


    font-size:14px;


}




.input-box{


    display:flex;


    align-items:center;


    background:white;


    border-radius:12px;


    padding:0 15px;


}



.input-box i{


    color:#2563eb;


}



.input-box input{


    width:100%;


    padding:15px;


    border:none;


    outline:none;


    font-size:15px;


}




.btn-login{


    width:100%;


    margin-top:30px;


    padding:15px;


    border:none;


    border-radius:12px;


    cursor:pointer;


    color:white;


    font-size:16px;


    font-weight:bold;



    background:

    linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
    );


    transition:.3s;


}




.btn-login:hover{


    transform:
    translateY(-3px);


    box-shadow:
    0 10px 30px rgba(37,99,235,.5);


}




.auth-footer{


    margin-top:25px;


    text-align:center;


    color:#dbeafe;


    font-size:14px;


}



.auth-footer a{


    color:white;


    text-decoration:none;


    font-weight:bold;


}



.auth-footer a:hover{

    text-decoration:underline;

}



</style>


</head>



<body>



<div class="auth-container">


<div class="auth-card">



<div class="auth-logo">

<i class="fa-solid fa-shield-halved"></i>

</div>




<div class="auth-header">

<h1>
Encrypted Text Sharing
</h1>


<p>
Securely store and share encrypted texts
</p>


</div>




<div id="errorMessage"
class="error-message">
</div>




<form id="loginForm">


<div class="form-group">


<label>
Email Address
</label>


<div class="input-box">

<i class="fa-solid fa-envelope"></i>


<input 
type="email"
id="email"
placeholder="example@gmail.com"
required>


</div>


</div>




<div class="form-group">


<label>
Password
</label>


<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input 
type="password"
id="password"
placeholder="••••••••"
required>


</div>


</div>




<button 
type="submit"
class="btn-login">


<i class="fa-solid fa-right-to-bracket"></i>

Login


</button>



</form>





<div class="auth-footer">


<p>

<a href="https://auth-service-kaef.onrender.com/forgot-password">
Forgot Password?
</a>


</p>



<p style="margin-top:10px;">


Don't have an account?


<a href="https://auth-service-kaef.onrender.com/signup">

Create Account

</a>


</p>



</div>




</div>

</div>






<script src="/static/js/auth.js"></script>


<script>


document
.addEventListener(
"DOMContentLoaded",
()=>{


document
.getElementById("loginForm")
.addEventListener(
"submit",
async(event)=>{


event.preventDefault();



const email =
document
.getElementById("email")
.value
.trim();



const password =
document
.getElementById("password")
.value;



const errorMessage =
document
.getElementById("errorMessage");



if(!email || !password){

errorMessage.textContent =
"Please fill in all fields.";

return;

}



try{


errorMessage.textContent="";



const response =
await fetch(
"/api/login",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:
JSON.stringify({

email,

password

})


});




const data =
await response.json();




if(response.ok){


Auth.saveSession(
data.user_id,
email
);


window.location.href="/";


return;


}



errorMessage.textContent =
data.error ||
data.message ||
"Invalid credentials.";



}

catch(error){


console.error(
"Login error:",
error
);


errorMessage.textContent =
"Failed to connect to server.";


}



});


});



</script>



</body>

</html>
