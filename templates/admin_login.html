<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #101826;
            color: #fff;
            font: 16px Arial, sans-serif;
        }

        form {
            width: min(360px, calc(100% - 40px));
            padding: 28px;
            background: #1b2437;
            border: 1px solid #34425c;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
            color: #17d67d;
        }

        label {
            display: block;
            margin: 16px 0 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #64748b;
            border-radius: 4px;
            background: #0f172a;
            color: #fff;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 4px;
            background: #17d67d;
            color: #06130d;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #fca5a5;
        }
    </style>
</head>

<body>
    <form method="post" action="/admin/login">
        <h1>Admin login</h1>
        {% if error_msg %}<p class="error">{{ error_msg }}</p>{% endif %}
        <label for="username">Username</label>
        <input id="username" name="username" required autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button type="submit">Sign in</button>
    </form>
</body>

</html>
